<rect x="380" y="90" width="300" height="54" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
<text x="530" y="112" font-size="13" font-weight="bold" text-anchor="middle">MCP Server</text>
<text x="530" y="130" font-size="12" text-anchor="middle">techcorp-sample-mcp v1.0.0</text>
<rect x="40" y="190" width="300" height="99" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>
<text x="48" y="208" font-size="12" font-weight="bold">read_file  [HIGH]</text>
<text x="48" y="223" font-size="12" font-weight="normal">tool · path:string</text>
<text x="48" y="238" font-size="11" font-weight="normal">Abuse: Read ./credentials.json (or any</text>
<text x="48" y="253" font-size="11" font-weight="normal">path via ../ traversal) to exfiltrate</text>
<text x="48" y="268" font-size="11" font-weight="normal">secrets.</text>
<rect x="40" y="305" width="300" height="99" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>
<text x="48" y="323" font-size="12" font-weight="bold">execute_command  [HIGH]</text>
<text x="48" y="338" font-size="12" font-weight="normal">tool · command:string</text>
<text x="48" y="353" font-size="11" font-weight="normal">Abuse: Run arbitrary OS commands</text>
<text x="48" y="368" font-size="11" font-weight="normal">(whoami, or fetch and run a remote</text>
<text x="48" y="383" font-size="11" font-weight="normal">script) for full RCE.</text>
<rect x="40" y="420" width="300" height="84" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>
<text x="48" y="438" font-size="12" font-weight="bold">write_file  [HIGH]</text>
<text x="48" y="453" font-size="12" font-weight="normal">tool · path:string, content:string</text>
<text x="48" y="468" font-size="11" font-weight="normal">Abuse: Overwrite a config or drop a</text>
<text x="48" y="483" font-size="11" font-weight="normal">persistence/web-shell file on the host.</text>
<rect x="380" y="190" width="300" height="84" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
<text x="388" y="208" font-size="12" font-weight="bold">list_directory  [MEDIUM]</text>
<text x="388" y="223" font-size="12" font-weight="normal">tool · path:string?</text>
<text x="388" y="238" font-size="11" font-weight="normal">Abuse: Enumerate the filesystem to</text>
<text x="388" y="253" font-size="11" font-weight="normal">locate secret files before reading them.</text>
<rect x="380" y="290" width="300" height="84" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
<text x="388" y="308" font-size="12" font-weight="bold">fetch_url  [MEDIUM]</text>
<text x="388" y="323" font-size="12" font-weight="normal">tool · url:string</text>
<text x="388" y="338" font-size="11" font-weight="normal">Abuse: SSRF to 169.254.169.254 cloud</text>
<text x="388" y="353" font-size="11" font-weight="normal">metadata to steal instance credentials.</text>
<rect x="380" y="390" width="300" height="84" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
<text x="388" y="408" font-size="12" font-weight="bold">handbook  [MEDIUM]</text>
<text x="388" y="423" font-size="12" font-weight="normal">resource · text/markdown</text>
<text x="388" y="438" font-size="11" font-weight="normal">Abuse: Poison the markdown with hidden</text>
<text x="388" y="453" font-size="11" font-weight="normal">instructions that the model later obeys.</text>
<rect x="380" y="490" width="300" height="99" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
<text x="388" y="508" font-size="12" font-weight="bold">app-config  [MEDIUM]</text>
<text x="388" y="523" font-size="12" font-weight="normal">resource · application/json</text>
<text x="388" y="538" font-size="11" font-weight="normal">Abuse: Leaks secrets_path and</text>
<text x="388" y="553" font-size="11" font-weight="normal">debug/allow_commands flags that guide</text>
<text x="388" y="568" font-size="11" font-weight="normal">other attacks.</text>
<rect x="380" y="605" width="300" height="84" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
<text x="388" y="623" font-size="12" font-weight="bold">summarize_resource  [MEDIUM]</text>
<text x="388" y="638" font-size="12" font-weight="normal">prompt · uri</text>
<text x="388" y="653" font-size="11" font-weight="normal">Abuse: Pulls raw resource text into the</text>
<text x="388" y="668" font-size="11" font-weight="normal">chat, carrying poisoned instructions in.</text>
